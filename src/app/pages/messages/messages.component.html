<div class="min-h-screen bg-[#FDF9F4] pb-24 pt-6 px-4 font-sans">
  
  <!-- Header -->
  <div class="flex items-center justify-between mb-6">
    <h1 class="text-2xl font-black text-[#3d1200] tracking-tight">Messages</h1>
    <button class="w-10 h-10 bg-white rounded-full flex items-center justify-center shadow-sm border border-orange-100 text-[#e87f2c]">
      <i class="bi bi-chat-right-text-fill"></i>
    </button>
  </div>

  <!-- Search Bar -->
  <div class="relative mb-6">
    <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-gray-400">
      <i class="bi bi-search"></i>
    </span>
    <input type="text" placeholder="Search for experts, support..." 
      class="w-full pl-11 pr-4 py-3.5 bg-white border border-orange-100 rounded-2xl text-xs font-bold text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-1 focus:ring-[#e87f2c] focus:border-[#e87f2c] shadow-[0_4px_15px_rgba(0,0,0,0.01)]" />
  </div>

  <!-- Chats List -->
  <div class="space-y-3">
    
    <!-- Empty state wrapper when no chats -->
    <div *ngIf="chats.length === 0" class="py-12 text-center">
      <div class="w-16 h-16 bg-orange-50 rounded-full flex items-center justify-center text-[#e87f2c] text-2xl mx-auto mb-4">
        <i class="bi bi-chat-left-dots"></i>
      </div>
      <p class="text-xs font-bold text-gray-400 uppercase tracking-widest">No conversations yet</p>
    </div>

    <!-- Active Chat Cards -->
    <div *ngFor="let chat of chats" 
      class="bg-white rounded-[2rem] p-4 flex items-center gap-4 border border-orange-50/50 shadow-[0_8px_30px_rgb(0,0,0,0.01)] hover:shadow-md cursor-pointer transition-all duration-300">
      
      <!-- Avatar Section -->
      <div class="relative shrink-0">
        <div class="w-12 h-12 rounded-full p-[1.5px] border border-orange-200 overflow-hidden bg-orange-50/30">
          <img [src]="chat.avatar" [alt]="chat.name" class="w-full h-full rounded-full object-cover">
        </div>
        <!-- Status Indicator Dot -->
        <span *ngIf="chat.online" 
          class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-white rounded-full"></span>
      </div>

      <!-- Info Area -->
      <div class="flex-grow min-w-0">
        <div class="flex items-baseline justify-between mb-0.5">
          <h3 class="text-sm font-black text-gray-900 truncate pr-2">{{ chat.name }}</h3>
          <span class="text-[9px] font-bold text-gray-400 uppercase tracking-tight shrink-0">{{ chat.time }}</span>
        </div>
        <p class="text-[9px] text-[#e87f2c] font-black uppercase tracking-wider mb-1">{{ chat.role }}</p>
        <p class="text-[11px] text-gray-500 font-medium truncate leading-tight">{{ chat.lastMessage }}</p>
      </div>

      <!-- Badge Area -->
      <div class="shrink-0 flex flex-col items-center justify-center" *ngIf="chat.unread > 0">
        <span class="bg-[#e87f2c] text-white text-[9px] font-black rounded-full w-5 h-5 flex items-center justify-center border border-white">
          {{ chat.unread }}
        </span>
      </div>

    </div>

  </div>

</div>
