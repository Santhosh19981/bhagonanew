<div *ngIf="showSplash" class="splash-screen" [class.fade-out]="fadeSplash">
  <div class="splash-content">
    <img src="assets/bhagona-logo-official.png" alt="Bhagona.in" class="splash-logo">
    <div class="splash-loader"></div>
    <span class="splash-tagline">One Platform • Endless Possibilities • Memorable Events</span>
  </div>
</div>

<ng-container *ngIf="isLaunchingSoon; else standardAppLayout">
  <!-- Immersive Full-Screen Launching Soon (No global header, footer, or mobile-nav to navigate away) -->
  <router-outlet></router-outlet>
</ng-container>

<ng-template #standardAppLayout>
  <!-- Full standard app layout for internal paths like /home, /events, /services, /login -->
  <ng-container *ngIf="!isMobile; else mobileLayout">
    <app-header></app-header>

    <main class="min-h-screen bg-gray-50 pt-[88px] md:pt-[94px]">
      <router-outlet></router-outlet>
    </main>

    <app-footer></app-footer>
  </ng-container>

  <ng-template #mobileLayout>
    <!-- Mobile App Layout Shell -->
    <div class="flex flex-col min-h-screen bg-[#FDF9F4] mobile-shell">
      <main class="flex-grow w-full">
        <router-outlet></router-outlet>
      </main>
      <app-mobile-nav></app-mobile-nav>
    </div>
  </ng-template>
</ng-template>
